name: Build Android APK

on:
  push:
    branches: [android-app]
    paths:
      - "android-app/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths:
      - "android-app/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with llama_jni.cpp / scripts/fetch-llama-cpp.sh
  LLAMA_TAG: b11799
  NDK_VERSION: 29.0.13113456
  CMAKE_VERSION: 3.31.6
  # ubuntu-24.04 runners ship the Android SDK here (see runner-images README).
  # We use it directly instead of a third-party setup action, which broke on the
  # Node 20 -> 24 migration and needs to download ~1 GB of SDK on every run.
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    name: Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # The NDK is ~1 GB, so cache it. Keyed on the exact version, so bumping
      # NDK_VERSION starts a fresh cache instead of restoring a stale one.
      - name: Cache NDK and CMake
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.ANDROID_SDK_ROOT }}/cmake/${{ env.CMAKE_VERSION }}
          key: android-native-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ env.CMAKE_VERSION }}

      - name: Install NDK and CMake
        shell: bash
        run: |
          set -euo pipefail
          # sdkmanager writes into the SDK root; make sure the runner user owns it.
          [ -w "$ANDROID_SDK_ROOT" ] || sudo chown -R "$USER" "$ANDROID_SDK_ROOT"
          # The image does not always put cmdline-tools on PATH, so resolve it.
          SDKMGR="$(command -v sdkmanager || true)"
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n1)"
          fi
          echo "using $SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          ls "$ANDROID_SDK_ROOT/ndk" "$ANDROID_SDK_ROOT/cmake"

      - name: Fetch llama.cpp (${{ env.LLAMA_TAG }})
        # bash, not ./: the executable bit is easy to lose on Windows checkouts.
        run: bash scripts/fetch-llama-cpp.sh

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v6

      - name: Python tests (CSV -> knowledge.json)
        run: python3 tools/test_build_knowledge.py

      - name: Kotlin unit tests (BM25)
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: bash ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: sainik-sahayak-debug-apk
          path: android-app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
